name: Herman compression regime backtest

on:
  push:
    branches:
      - research/herman-compression-backtest-20260911

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run Herman QQQ proxy backtest
        shell: bash
        run: |
          python -m pip install --quiet pandas numpy
          python - <<'PY'
          import json, urllib.request
          import numpy as np
          import pandas as pd

          URL='https://raw.githubusercontent.com/lvrusu/QQQ_price_data/main/QQQ5m_regular_raw_1_2018_to_9_30_24.csv'
          path='/tmp/qqq5m.csv'
          urllib.request.urlretrieve(URL,path)
          df=pd.read_csv(path)
          cmap={str(c).strip().lower():c for c in df.columns}
          tcol=next((cmap[k] for k in ['date_time','datetime','timestamp','time','ds'] if k in cmap),None)
          if tcol is None: raise RuntimeError(f'No time column {list(df.columns)}')
          cols=[]
          for k in ['open','high','low','close']:
              if k not in cmap: raise RuntimeError(f'Missing {k}; {list(df.columns)}')
              cols.append(cmap[k])
          x=df[[tcol]+cols].copy(); x.columns=['ts','open','high','low','close']
          x['ts']=pd.to_datetime(x['ts'],errors='coerce')
          for c in ['open','high','low','close']: x[c]=pd.to_numeric(x[c],errors='coerce')
          x=x.dropna().drop_duplicates('ts').sort_values('ts').set_index('ts')
          x=x.between_time('09:30','16:00').copy()
          x['sma50']=x.close.rolling(50,min_periods=50).mean()
          x['sma200']=x.close.rolling(200,min_periods=200).mean()
          x['prev_close']=x.close.shift(1); x['prev_sma50']=x.sma50.shift(1)
          print('DATA',x.index.min(),x.index.max(),len(x),list(df.columns))

          windows={
            'Jan2020_quiet':('2020-01-02','2020-01-31','calm'),
            'Jun2021_compression':('2021-06-01','2021-06-30','calm'),
            'May2022_expansion':('2022-05-02','2022-05-31','expansion'),
            'Feb2024_quiet':('2024-02-20','2024-02-29','calm'),
            'May2024_quiet':('2024-05-01','2024-05-31','calm'),
            'Jul2024_transition':('2024-07-01','2024-07-31','transition'),
            'Aug2024_shock':('2024-08-01','2024-08-09','expansion')}
          variants={'loose':(.0012,.0050),'primary':(.0015,.00625),'strict':(.0018,.0075)}
          cost=.0004

          def mask(start,end):
              return (x.index>=pd.Timestamp(start))&(x.index<pd.Timestamp(end)+pd.Timedelta(days=1))

          def run(start,end,sep,stop_pct):
              inds=np.flatnonzero(mask(start,end)); trades=[]
              if not len(inds): return trades
              lo,hi=inds[0],inds[-1]; pos=0; entry=None; entry_i=-1; entry_ts=None; skip=-1
              for i in range(lo,hi+1):
                  r=x.iloc[i]; ts=x.index[i]
                  if pos and i>entry_i:
                      st=entry*(1-stop_pct) if pos==1 else entry*(1+stop_pct)
                      tar=float(r.sma200) if pd.notna(r.sma200) else np.nan
                      px=None; why=None
                      # Conservative same-bar ordering: stop before target.
                      if pos==1:
                          if r.low<=st: px=st; why='stop'
                          elif pd.notna(tar) and r.low<=tar<=r.high: px=tar; why='sma200'
                      else:
                          if r.high>=st: px=st; why='stop'
                          elif pd.notna(tar) and r.low<=tar<=r.high: px=tar; why='sma200'
                      nextdate=x.index[i+1].date() if i<len(x)-1 else None
                      if px is None and (nextdate!=ts.date() or i==hi): px=float(r.close); why='eod'
                      if px is not None:
                          gross=pos*(px-entry)/entry; ret=gross-cost
                          trades.append({'ret':ret,'gross':gross,'why':why,'entry_ts':str(entry_ts),'exit_ts':str(ts)})
                          pos=0; entry=None; entry_i=-1; entry_ts=None; skip=i
                  if pos or i==skip: continue
                  if any(pd.isna(v) for v in [r.sma50,r.sma200,r.prev_close,r.prev_sma50]): continue
                  if abs(r.sma50-r.sma200)/r.close<sep: continue
                  up=(r.close>r.sma50 and r.prev_close<=r.prev_sma50)
                  dn=(r.close<r.sma50 and r.prev_close>=r.prev_sma50)
                  if up and r.sma50<r.sma200: pos=1; entry=float(r.close); entry_i=i; entry_ts=ts
                  elif dn and r.sma50>r.sma200: pos=-1; entry=float(r.close); entry_i=i; entry_ts=ts
              return trades

          def met(t):
              if not t:return {'trades':0,'win_rate':None,'pf':None,'return_pct':0.0,'max_dd_pct':0.0,'expectancy_bp':None}
              r=np.array([q['ret'] for q in t]); w=r[r>0]; l=r[r<0]
              pf=float(w.sum()/abs(l.sum())) if len(l) else float('inf')
              eq=np.r_[1.0,np.cumprod(1+r)]; peak=np.maximum.accumulate(eq); dd=eq/peak-1
              return {'trades':len(r),'win_rate':float((r>0).mean()*100),'pf':pf,'return_pct':float((eq[-1]-1)*100),'max_dd_pct':float(-dd.min()*100),'expectancy_bp':float(r.mean()*10000)}

          def bh(start,end):
              s=x.loc[mask(start,end)]
              return None if s.empty else float((s.iloc[-1].close/s.iloc[0].open-1)*100)

          for vname,(sep,stop) in variants.items():
              pooled={'calm':[],'transition':[],'expansion':[]}
              bh_stitched={'calm':1.0,'transition':1.0,'expansion':1.0}
              for name,(start,end,regime) in windows.items():
                  tr=run(start,end,sep,stop); pooled[regime]+=tr
                  b=bh(start,end)
                  if b is not None: bh_stitched[regime]*=(1+b/100)
                  out={'variant':vname,'window':name,'regime':regime,**met(tr),'bh_pct':b}
                  if vname=='primary': print('RESULT',json.dumps(out,sort_keys=True,allow_nan=True))
              for regime,tr in pooled.items():
                  out={'variant':vname,'window':'POOLED_'+regime.upper(),'regime':regime,**met(tr),'bh_pct':(bh_stitched[regime]-1)*100}
                  print('POOL',json.dumps(out,sort_keys=True,allow_nan=True))
          PY
