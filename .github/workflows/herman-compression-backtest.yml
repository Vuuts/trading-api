name: Herman compression regime backtest

on:
  push:
    branches:
      - research/herman-compression-backtest-20260911

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run displacement-failure-rotation test
        run: |
          python -m pip install --quiet pandas numpy
          python research/herman_dfr_backtest.py
