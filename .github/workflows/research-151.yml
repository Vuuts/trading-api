name: research-151-strategies
on:
  push:
    branches:
      - research/151-strategies-20260906
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance pandas numpy
      - name: Run EMA comparison backtest
        shell: bash
        run: |
          cat > /tmp/backtest.py <<'PY'
          import math
          import numpy as np
          import pandas as pd
          import yfinance as yf

          TD=252
          BPS=2.0
          START='2005-01-01'
          OOS='2024-01-01'
          END='2026-09-05'

          def metrics(ret,pos,to):
              x=ret.dropna(); eq=(1+x).cumprod(); yrs=len(x)/TD
              total=eq.iloc[-1]-1; cagr=eq.iloc[-1]**(1/yrs)-1
              vol=x.std(ddof=1)*math.sqrt(TD)
              sharpe=x.mean()/x.std(ddof=1)*math.sqrt(TD) if x.std(ddof=1)>0 else np.nan
              dd=(eq/eq.cummax()-1).min()
              return dict(total_return=total,cagr=cagr,ann_vol=vol,sharpe=sharpe,max_dd=dd,
                          turnover=to.reindex(x.index).fillna(0).sum(),
                          switches=int((pos.diff().abs().fillna(0)>0).sum()),
                          exposure=float(pos.reindex(x.index).abs().mean()))

          def apply_costs(asset_ret,pos):
              held=pos.shift(1).fillna(0)
              to=pos.diff().abs().fillna(pos.abs())
              cost=to*(BPS/10000)
              return held*asset_ret-cost.shift(1).fillna(0),to

          def pair(c,fast,slow,kind):
              if kind=='EMA':
                  f=c.ewm(span=fast,adjust=False).mean(); s=c.ewm(span=slow,adjust=False).mean()
              else:
                  f=c.rolling(fast).mean(); s=c.rolling(slow).mean()
              p=pd.Series(0.0,index=c.index)
              p[f>s]=1.; p[f<s]=-1.
              return p

          spy=yf.download('SPY',start=START,end=END,auto_adjust=True,progress=False)
          if spy.empty: raise SystemExit('NO SPY DATA')
          c=spy['Close']['SPY'] if isinstance(spy.columns,pd.MultiIndex) else spy['Close']
          print('DATA',c.index.min().date(),c.index.max().date(),len(c))
          tests={
              'SMA 9/50 long-short':pair(c,9,50,'SMA'),
              'EMA 9/50 long-short':pair(c,9,50,'EMA'),
              'EMA 10/50 long-short':pair(c,10,50,'EMA'),
              'EMA 9/30 long-short':pair(c,9,30,'EMA'),
          }
          r=c.pct_change(); rows=[]
          bhp=pd.Series(1.,index=c.index); bhr,bhto=apply_costs(r,bhp)
          for name,p in tests.items():
              sr,to=apply_costs(r,p)
              for period,mask in [('FULL',c.index>=c.index.min()),('IS',c.index<pd.Timestamp(OOS)),('OOS',c.index>=pd.Timestamp(OOS))]:
                  idx=c.index[mask]
                  rows.append({'strategy':name,'period':period,**metrics(sr.reindex(idx),p.reindex(idx),to.reindex(idx))})
          for period,mask in [('FULL',c.index>=c.index.min()),('IS',c.index<pd.Timestamp(OOS)),('OOS',c.index>=pd.Timestamp(OOS))]:
              idx=c.index[mask]
              rows.append({'strategy':'SPY buy&hold','period':period,**metrics(bhr.reindex(idx),bhp.reindex(idx),bhto.reindex(idx))})
          out=pd.DataFrame(rows)
          print('\nRESULTS_BEGIN')
          print(out.to_csv(index=False,float_format='%.6f'))
          print('RESULTS_END')
          PY
          python /tmp/backtest.py
